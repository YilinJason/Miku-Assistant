# =============================================================================
# Miku 桌面助手 — 主配置文件
# 路径：config/config.yaml（可通过 CLI --config 指定其他路径）
# 修改后重启助手生效；部分项（如 auto_tts）可在运行时通过命令行覆盖
# =============================================================================

# -----------------------------------------------------------------------------
# Ollama LLM 配置
# 控制与本地 Ollama 服务的连接及所用模型
# -----------------------------------------------------------------------------
ollama:
  # Ollama HTTP API 根地址
  # 有效值：完整 URL，如 http://localhost:11434 或远程地址
  # 默认：http://localhost:11434
  base_url: "http://localhost:11434"

  # 对话使用的模型名称（须已在 Ollama 中 pull/create）
  # 有效值：ollama list 中显示的模型名，如 llama3、Miku_Assistant-emotion:latest
  # 默认：Miku_Assistant-emotion:latest
  model: "Miku_Assistant-emotion:latest"

  # 单次 LLM 请求超时时间（秒）
  # 有效值：正整数
  # 默认：60
  timeout: 60

  # 模型在内存/显存中的保活时长，避免几分钟空闲后再次冷加载
  # Ollama duration 格式，例如 30m、1h；0 表示请求后立即卸载
  keep_alive: "30m"

  # 程序启动时用空 chat 请求在后台预载模型；不写入会话历史
  warmup_on_start: true

  # 后台预热请求超时（秒）；预热失败不会阻止正式对话
  warmup_timeout: 120

  # 进程内会话历史存储上限（完整 user/assistant 轮）
  # 与请求窗口（默认最近 10 条消息）分离；拒绝 bool/字符串/非正数
  history:
    max_stored_turns: 500

# -----------------------------------------------------------------------------
# 语音配置
# 包含 TTS（文字转语音）与 STT（语音转文字）子系统
# -----------------------------------------------------------------------------
voice:
  # ---------------------------------------------------------------------------
  # 文字转语音（TTS）
  # 默认 edge-tts 在线合成；可配置 RVC 后处理为自定义角色音色
  # ---------------------------------------------------------------------------
  tts:
    # TTS 引擎标识
    # 有效值：edge-tts（默认，需网络）| pyttsx3（纯离线应急）| cosyvoice（可选本地，须 security.permissions.local_tts_worker: true）
    # 默认：edge-tts（未预热 CosyVoice；冷首句约 19s、热句含 RVC 约 5.8–8.3s 为实测参考，非 SLA）
    engine: "edge-tts"

    # 可选 CosyVoice 内层参数（仅 engine=cosyvoice；固定 warm_companion，无自由模型/路径/instruct）
    # 默认整块省略；装配前严格校验，模型仍在首次语音时懒加载，不声称已预热
    # cosyvoice:
    #   max_text_chars: 120
    #   startup_timeout_sec: 30

    # edge-tts 的 voice 名称（仅 engine=edge-tts 时生效）
    # 有效值：edge-tts 支持的 Neural 语音名，如 zh-CN-XiaoxiaoNeural
    # 默认：zh-CN-XiaoxiaoNeural
    voice: "zh-CN-XiaoxiaoNeural"

    # 合成语言区域（影响 edge-tts 与部分引擎的默认行为）
    # 有效值：BCP-47 语言标签，如 zh-CN、en-US
    # 默认：zh-CN
    language: "zh-CN"

    # 语速（主要供 pyttsx3 应急引擎使用；edge-tts 有独立 rate 逻辑）
    # 有效值：正整数，数值越大语速越快
    # 默认：150
    rate: 150

    # 播放音量
    # 有效值：0.0（静音）~ 1.0（最大）
    # 默认：0.8
    volume: 0.8

    # edge-tts 不可用时是否自动回退到 fallback_engine
    # 有效值：true | false
    # 默认：true
    fallback_enabled: true

    # 主引擎失败时的备用 TTS 引擎
    # 有效值：pyttsx3
    # 默认：pyttsx3
    fallback_engine: "pyttsx3"

    # 长回复分句流水线：边合成边播放，降低首句等待时间
    # 有效值：true | false
    # 默认：true
    pipeline_enabled: true

    # -------------------------------------------------------------------------
    # edge-tts 句级韵律（仅影响 Communicate 的 rate/pitch/volume；不改正文、不写 SSML）
    # 非法格式在构造 TTS 前失败；enabled=false 时始终 +0% / +0Hz / +0%
    # -------------------------------------------------------------------------
    edge_prosody:
      # 是否启用句级基值与问句/感叹/省略 delta
      # 有效值：true | false
      enabled: true
      # 基值（严格带符号）：rate/volume 为 +N%/-N%；pitch 为 +NHz/-NHz
      rate: "-4%"
      pitch: "+0Hz"
      volume: "+0%"
      # 问句相对基值的整数 delta（最终 clamp：rate±30%、pitch±50Hz）
      question_rate_delta_pct: 2
      question_pitch_delta_hz: 4
      # 感叹句
      exclamation_rate_delta_pct: 2
      exclamation_pitch_delta_hz: 3
      # 省略/舒缓（… 或 ...）
      ellipsis_rate_delta_pct: -3
      ellipsis_pitch_delta_hz: -2

    # -------------------------------------------------------------------------
    # RVC（Retrieval-based Voice Conversion）音色转换
    # edge-tts 生成 WAV 后，可选经 RVC 转为 Nahida 等自定义音色
    # 首次使用请运行: powershell -ExecutionPolicy Bypass -File scripts/setup_voice_env.ps1
    # 未配置 model_path 时整个 RVC 子块被忽略
    # -------------------------------------------------------------------------
    rvc:
      # RVC 模型权重文件路径（相对项目根或绝对路径）
      # 有效值：存在的 .pth 文件路径
      # 默认：src/voice/Nahida/nahida-2h-500epoch.pth
      model_path: "src/voice/Nahida/nahida-2h-500epoch.pth"

      # FAISS 特征索引文件路径（可选，提升相似度检索质量）
      # 有效值：存在的 .index 文件路径；缺失时仅用模型、index_rate 自动置 0
      # 默认：src/voice/Nahida/added_IVF7975_Flat_nprobe_1_v2.index
      index_path: "src/voice/Nahida/added_IVF7975_Flat_nprobe_1_v2.index"

      # 推理设备
      # 有效值：auto | cpu | cuda:0（auto 有 CUDA 时用 cuda:0，否则 cpu）
      # 默认：auto
      device: "auto"

      # 是否启用常驻 RVC Worker 进程（模型只加载一次，降低延迟）
      # 有效值：true | false；Worker 失败后的行为由 fallback_on_worker_failure 控制
      # 默认：true
      worker_enabled: true

      # Worker 单段推理最长等待秒数；超时会终止 Worker 并回退默认音色
      # 默认：45
      worker_infer_timeout: 45

      # Worker 模型加载后用一秒合成测试信号完成首次推理预热；不会播放或保留音频
      # 默认：true（增加一次启动计算，降低第一句 RVC 等待）
      worker_warmup_inference: true

      # 首次推理预热最长等待秒数；失败则 warm_rvc_worker / prepare_rvc 视为未就绪
      # 默认：45
      worker_warmup_timeout: 45

      # 启动时用内存数组预热 librosa 重采样，减少第一段 MP3→WAV 延迟
      # 默认：false；首次 JIT 时间受环境影响较大，按需开启
      prewarm_audio_processing: false

      # Worker 失败后是否再冷启动一次性 RVC 子进程。
      # 默认关闭，避免长回复逐句重复加载模型造成 CPU/GPU/内存资源风暴。
      # worker_enabled=false 时仍直接使用一次性子进程。
      fallback_on_worker_failure: false

      # 显式使用一次性子进程时的最长等待秒数
      # 默认：90
      subprocess_timeout: 90

      # 音调偏移（半音）
      # 有效值：整数，通常 -12 ~ 12
      # 默认：0
      pitch: 0

      # 检索特征在混合中的占比（需有效 index_path）
      # 有效值：0.0 ~ 1.0；偏高易出现颗粒感/电流感，日常对话建议 0.5~0.65
      # 默认：0.55
      index_rate: 0.55

      # 送入 RVC 前 MP3→WAV 的目标采样率（与 RVC 训练/推理习惯一致，减轻重采样伪影）
      # 有效值：正整数，常用 40000
      # 默认：40000
      input_sample_rate: 40000

      # vc_single：保护清辅音/气声，减轻电音伪影；0.5 为关闭保护，更小（如 0.33）更保护
      # 有效值：0.0 ~ 0.5
      # 默认：0.5
      protect: 0.5

      # vc_single：源音量包络混合比（1.0 完全用转换后包络；略低更自然）
      # 有效值：0.0 ~ 1.0
      # 仓库调优：0.68 更多保留源响度包络；听感需人工 A/B，离线测试不证明提升
      # 代码兼容默认仍为 0.75（无 YAML 调用方不静默改变）
      rms_mix_rate: 0.68

      # vc_single：f0 中值滤波半径（仅 f0_method=harvest 时生效；rmvpe 不使用）
      # 有效值：非负整数，0 表示关闭
      # 仓库调优：1；使用 harvest 时可回退 2/3 加强平滑
      # 代码兼容默认仍为 3（无 YAML 调用方不静默改变）
      filter_radius: 1

      # vc_single：基频提取方法
      # 有效值：rmvpe | harvest | crepe 等（取决于 rvc-python 支持）
      # 默认：rmvpe
      f0_method: "rmvpe"

      # RVC 输出后处理：高通 + 软限幅，减轻底噪/电流感
      # 有效值：true | false
      # 默认：true
      postprocess_enabled: true

      # 后处理高通截止频率（Hz）；0 表示跳过高通
      # 默认：80
      postprocess_highpass_hz: 80

      # 后处理峰值归一目标（0~1）
      # 默认：0.95
      postprocess_peak: 0.95

      # RVC 专用 Python 解释器路径（覆盖默认 .venv-rvc）
      # 有效值：null（使用项目根 .venv-rvc）或 python.exe 绝对/相对路径
      # 默认：null（未设置）
      # python_path: null

  # ---------------------------------------------------------------------------
  # 语音转文字（STT）
  # 语音交互模式下的麦克风识别配置
  # ---------------------------------------------------------------------------
  stt:
    # STT 引擎标识
    # 有效值：
    #   paraformer — 本地 CPU Paraformer-zh + FunASR worker（默认；需 .venv-asr 与 security.permissions.local_asr_worker）
    #   speech_recognition — Google 在线识别（须 cloud_stt: true；会上传麦克风音频）
    #   whisper — 本地 OpenAI Whisper（需 pip install openai-whisper，首次可能下载模型）
    # 默认：paraformer
    engine: "paraformer"

    # 识别语言
    # 有效值：BCP-47 语言标签，如 zh-CN（Whisper 会取主语言 zh）
    # 默认：zh-CN
    language: "zh-CN"

    # 麦克风能量阈值（speech_recognition / paraformer 录音路径；校准后可能被覆盖）
    # 有效值：正整数；环境嘈杂可调高，说话偏轻可调低（如 300–1500）
    # 默认：4000
    energy_threshold: 4000

    # Paraformer 本地 worker 有界参数（固定资产路径见 src/voice/paraformer/assets.py）
    paraformer:
      # CPU 推理线程（有效 1–4）
      cpu_threads: 2
      # worker 冷启动上限（秒）
      startup_deadline_sec: 45
      # 单次 utterance 推理上限（秒）
      inference_deadline_sec: 15
      # shutdown 预算（秒）
      close_budget_sec: 2

    # 可选：显式麦克风 device_index（null=系统默认）；无效索引报错，不悄悄换设备
    microphone_device_index:

    # 默认 Paraformer 麦克风路径声学准入（enabled:false 为显式兼容关闭，非自动回退）
    input_audio:
      enabled: true
      capture_mode: continuous
      backend: silero_onnx
      speech_probability_threshold: 0.6
      noise_suppression: webrtc
      energy_floor: 300
      energy_ceiling: 12000
      vad_mode: 2
      min_voiced_ms: 180
      min_consecutive_ms: 90
      min_voiced_ratio: 0.12

# -----------------------------------------------------------------------------
# 系统功能配置
# Windows 系统控制（关机、重启、锁屏等）总开关
# -----------------------------------------------------------------------------
system:
  # 是否启用 Windows 系统控制意图（关闭后相关指令不执行）
  # 有效值：true | false
  # 默认：false；个人使用时按需显式开启
  windows_control_enabled: false

  # 关机/重启/锁屏前是否弹出二次确认
  # 有效值：true | false（强烈建议保持 true）
  # 默认：true
  require_confirmation: true

# -----------------------------------------------------------------------------
# 安全策略
# 控制所有可能影响本机的操作；默认保守，需用户显式开启危险权限
# 注意：注册表写入在代码层永久禁止，无法通过配置开启 registry_write
# -----------------------------------------------------------------------------
security:
  permissions:
    # 读取 Windows 注册表（如自动检测 Chrome 安装路径）
    # 有效值：true | false
    # 默认：false
    registry_read: false

    # 写入注册表（仅文档占位；代码硬禁止，配置无效）
    # 有效值：仅 false
    # 默认：false
    registry_write: false

    # 电源操作：关机、重启、锁屏（仍受 system.require_confirmation 约束）
    # 有效值：true | false
    # 默认：false
    system_power: false

    # 启动子进程（通用兼容入口；RVC 使用下方专用能力，不依赖本项）
    # 有效值：true | false
    # 默认：false
    subprocess: false

    # RVC 常驻 Worker 子进程（固定解释器 + scripts/rvc_worker.py）
    # 有效值：true | false
    # 默认：true
    rvc_worker: true

    # RVC 一次性推理子进程（固定解释器 + scripts/rvc_infer.py）
    # 有效值：true | false
    # 默认：true
    rvc_infer: true

    # RVC 环境/设备探测（固定 -c 片段）
    # 有效值：true | false
    # 默认：true
    rvc_probe: true

    # 非 loopback 模型端点（HTTPS 或需 insecure_* 的明文 HTTP）
    # 有效值：true | false
    # 默认：false；开启后 system/历史/用户正文可发往该主机
    remote_model_endpoint: false

    # 非 loopback 明文 HTTP 模型端点（须同时开启 remote_model_endpoint）
    # 有效值：true | false
    # 默认：false；流量无 TLS
    insecure_remote_model_http: false

    # 云端 STT（Google recognize_google）：会上传麦克风音频
    # 有效值：true | false
    # 默认：false（默认本地 Paraformer）；回退 Google 须 engine: speech_recognition 且 cloud_stt: true
    cloud_stt: false

    # 云端 TTS（edge-tts）：会发送待朗读回复文本
    # 有效值：true | false
    # 默认：true（保持现有 edge-tts）；裸 SafetyPolicy() 仍拒绝
    cloud_tts: true

    # 可选 CosyVoice 本地 runtime worker（固定 PROJECT_ROOT 资产；与 engine=cosyvoice 联用）
    # 有效值：true | false
    # 默认：false（保持 edge-tts 默认路径）
    local_tts_worker: false

    # 本地 Paraformer ASR worker（固定 PROJECT_ROOT 资产；与 engine=paraformer 联用）
    # 有效值：true | false
    # 默认：true；裸 SafetyPolicy() 仍拒绝
    local_asr_worker: true

    # os.system 类 Shell 调用（高风险，默认关闭）
    # 有效值：true | false
    # 默认：false
    os_shell: false

    # 打开系统默认或指定浏览器
    # 有效值：true | false
    # 默认：false；搜索结果仍可打印 URL
    browser_launch: false

    # 删除文件（仅限白名单目录：logs、data/tmp、data/test；临时音频另需 TempFileManager 所有权）
    # 有效值：true | false
    # 默认：true
    file_delete: true

    # 修改当前进程环境变量（RVC 子进程、PATH 等）
    # 有效值：true | false
    # 默认：false
    env_modify: false

# -----------------------------------------------------------------------------
# 搜索配置
# 网页搜索意图：搜索引擎选择与浏览器行为
# -----------------------------------------------------------------------------
search:
  # Chrome 可执行文件路径；null 表示自动检测或使用系统默认浏览器
  # 有效值：null 或 chrome.exe 的绝对路径
  # 默认：null
  chrome_path: null

  # 默认搜索引擎
  # 有效值：google | bing | baidu
  # 默认：google
  search_engine: "google"

  # 识别到搜索意图后是否自动打开浏览器
  # 有效值：true | false
  # 默认：false；仅返回 URL，不自动启动外部程序
  auto_open: false

# -----------------------------------------------------------------------------
# 扩展功能配置
# 预留第三方/角色模型集成（当前未实现完整流程）
# -----------------------------------------------------------------------------
extensions:
  character_model:
    # 是否启用角色模型扩展
    # 有效值：true | false
    # 默认：false
    enabled: false

    # 扩展类型标识
    # 有效值：null | unity | other（视具体实现而定）
    # 默认：null
    type: null

    # 扩展专属键值配置（结构由 type 决定）
    # 有效值：YAML 对象，默认空对象
    # 默认：{}
    config: {}

# -----------------------------------------------------------------------------
# 助手行为与运维配置
# 日志、自动 TTS、定时清理等
# -----------------------------------------------------------------------------
assistant:
  # LLM 回复后是否自动朗读（可被 CLI --auto-tts 覆盖为 true）
  # 有效值：true | false
  # 默认：true
  auto_tts: true

  # 是否默认走增量显示 + 分句播报（可被 CLI --stream / 交互命令 stream 覆盖）
  # 有效值：true | false
  # 默认：true（缩短首段等待）
  stream_reply: true

  # 本地陪伴人格（固定模板；零额外模型调用）
  # enabled 必须为严格 bool；false 时完全不注入基础人格
  # profile 仅接受仓库审查值 warm_balanced；未知值 fail closed
  companion:
    enabled: true
    profile: warm_balanced

  # 语音回复期间是否继续监听；有效用户插话会取消当前生成/播报
  # 当前为转写级回声过滤，不等同于声学 AEC；建议使用耳机获得最佳效果
  duplex_listening: true

  # 全双工监听每次等待语音开始的超时（秒）；较短值便于会话及时退出
  duplex_listen_timeout: 0.8

  # 一次录音最长秒数。过短会把没说完的话截断后送去识别。
  duplex_phrase_time_limit: 16.0

  # 播放结束后继续把相似转写视作回声的宽限时间（秒）
  duplex_echo_grace_seconds: 1.0

  # 有效插话后等待旧回复任务停止的上限（秒）；超时则暂停会话避免任务重叠。
  # 冷启动首段可能超过 5 秒，过短会把正常回复误判成停不下来。
  duplex_interrupt_wait_timeout: 20.0

  # 回复期间普通插话最少规范化字符数；“停/stop”等控制词不受此限制
  duplex_min_interrupt_chars: 2

  # 插话与已生成助手文本的最长片段覆盖率达到此值时按回声丢弃
  duplex_echo_match_ratio: 0.72

  # 增量分句缓冲上限（字符）；无句末标点时强制切分，防止无限缓存
  stream_sentence_max_buffer: 500

  # 分句播报有界队列容量；满时阻塞等待空位（可取消），不静默丢句
  stream_speech_queue_size: 8

  # 播报队列轮询间隔（秒）：背压等待与消费者取队列共用
  stream_speech_poll_interval: 0.05

  # 语音流式轮次：等待本轮播报完成的有界超时（秒）
  # 超时返回播报超时状态，不谎称播放完成
  stream_playback_wait_timeout: 120

  # 语音唤醒词（可选；具体行为取决于语音会话实现）
  # 有效值：字符串或 null
  # 默认：miku
  wake_word: "miku"

  # 全局日志级别
  # 有效值：DEBUG | INFO | WARNING | ERROR
  # 默认：INFO
  log_level: "INFO"

  logging:
    # 是否将日志写入 logs/ 目录（便于崩溃后排查）
    # 有效值：true | false（必须为真 bool）
    # 默认：true
    file_enabled: true

    # 主日志文件名（必须是 logs/ 下的单个安全文件名，禁止路径分量）
    # 有效值：如 miku.log；拒绝 ../、盘符、CON/NUL 等
    # 默认：miku.log
    file_name: "miku.log"

    # 单个日志文件大小上限（MB），超出后自动轮转
    # 有效值：有限正数，硬上限 50；拒绝 bool/字符串/NaN/Inf
    # 换算上取整且至少 1 字节（避免极小正数变成 maxBytes=0 禁用轮转）
    # 默认：10
    # 持久日志磁盘上界约 max_size_mb * (backup_count + 1)；backup_count=0 时为单文件有界截断
    max_size_mb: 10

    # 轮转后保留的历史文件数量（miku.log.1 ~ .N）
    # 有效值：真 int，范围 0..10；0=仅主文件，超限后同路径截断（不创建 .1）
    # 默认：5
    backup_count: 5

    # 文件日志是否持久化 traceback（含绝对源码路径与异常链）
    # 有效值：true | false（必须为真 bool）
    # 默认：false（仅影响文件 handler；控制台不受此开关改变）
    # 即使为 true，调用点仍禁止记录用户正文/查询/URL/原始 stderr
    include_tracebacks: false

  file_cleanup:
    # 后台清理任务检查间隔（分钟）
    # 有效值：正数
    # 默认：10
    interval_minutes: 10

    # 启动时是否由后台 Timer 立即跑一轮（调用线程仍不同步无界扫描）
    # 默认：false
    cleanup_on_start: false

    # 每轮最大扫描文件数（所有规则合计）
    # 默认：500
    max_scan_files: 500

    # 每轮最大删除文件数
    # 默认：100
    max_delete_files: 100

    # data/tmp 下临时音频文件最大保留时间（小时）
    # 有效值：正浮点数
    # 默认：1.0
    # 注意：只清理 data/tmp，不清理仓库根 tmp/
    tmp_max_age_hours: 1.0

    # logs/ 下过期日志最大保留天数
    # 有效值：正数
    # 默认：1
    logs_max_age_days: 1

    # data/test 下测试输出最大保留时间（小时）
    # 有效值：正数
    # 默认：72
    test_max_age_hours: 72

# -----------------------------------------------------------------------------
# 长期记忆
# 启用后：请求前有界词法召回注入 system；成功完整轮次异步提取落库。
# 后台提取可能与前台生成争用同一 Ollama/GPU，本配置不解决优先级调度。
# -----------------------------------------------------------------------------
memory:
  # 是否启用长期记忆产品接线
  # 当前个人配置已启用；关闭后不创建数据库、不启动提取线程、不包装 LLM
  enabled: true

  # 正式 SQLite 数据库；诊断库 tmp/memory-live-test.sqlite3 不用于主程序
  db_path: data/memory/long_term.sqlite3

  recall:
    max_entries: 8
    max_chars: 1200
    candidate_limit: 200

  ingestion:
    queue_capacity: 32
    max_extractions_per_turn: 16
    close_drain: true
    close_timeout: 5.0

  extractor:
    # 空值回退到 ollama.* 对应项（model/base_url/timeout/keep_alive）
    # num_ctx: null = 继承模型/服务 context（不写入 options），避免同模型 8192↔2048 重建 runner
    # 显式正整数仍写入请求；num_predict 限制生成长度，默认保留
    base_url: null
    model: null
    timeout: null
    keep_alive: null
    num_ctx: null
    num_predict: 512

  # 有界保留与低干扰维护
  # 仅在空闲且无前台请求时定期 prune；仍保护 USER_CONFIRMED。
  retention:
    enabled: true
    max_records: 2000
    max_age_days: 365
    maintenance_interval_hours: 24
    preserve_user_confirmed: true
    batch_limit: 64

# -----------------------------------------------------------------------------
# 资源协调（Round 2）
# profile=balanced：Ollama 与 RVC 串行预热，退出默认不卸载模型驻留。
# unload_on_exit 默认 false，且不会因 profile 暗中开启。
# 若显式 true：对共享 Ollama 中指定模型发出 best-effort keep_alive=0（可能影响同名其他客户端），不停止 Ollama 服务。
# -----------------------------------------------------------------------------
resource:
  profile: balanced
  ollama:
    # null/缺省时回退 ollama.warmup_on_start
    warmup_on_start: true
    unload_on_exit: false
  rvc:
    warmup_on_voice_start: true
  warmup:
    serialize_gpu: true
    order: ollama_then_rvc
    # 资源协调等待 Ollama 预热（串行 GPU）硬上限秒；与前台等待分离；最大 300
    # null/缺省时回退 ollama.warmup_timeout
    timeout: 120
    # 用户前台正式请求等待后台预热的短上限秒；默认 5，硬上限 10
    foreground_wait_sec: 5
